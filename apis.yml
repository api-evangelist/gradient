name: Gradient
description: >-
  Gradient is a decentralized AI infrastructure company building the Open
  Intelligence Stack — a peer-powered, sovereign alternative to centralized AI
  clouds. Its stack pairs Parallax (a distributed model-serving / world inference
  engine that turns heterogeneous machines into one AI cluster), Lattica (a
  universal peer-to-peer data-motion engine that moves model weights and
  inference tokens across a global machine mesh), Echo (distributed reinforcement
  learning) and Symphony (a decentralized multi-agent framework). Gradient Cloud
  is the enterprise inference offering, exposing an OpenAI-compatible REST API
  (model listing, chat completion, and text completion, streaming or
  non-streaming) at apis.gradient.network. The projects run atop a Solana-based
  network whose Sentry Node browser extension let contributors share edge
  compute. Gradient is backed by Multicoin Capital and Wing Venture Capital.
