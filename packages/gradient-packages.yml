  projects under the GradientHQ GitHub org. These are frameworks / infrastructure
  (distributed serving, P2P data motion, multi-agent, RL), not client SDKs for the
  Gradient Cloud REST API — that API is OpenAI-compatible, so any OpenAI client
  library works against it. Parallax installs from source (git clone + install.sh),
  not from PyPI, so no PyPI package is claimed as official here.
